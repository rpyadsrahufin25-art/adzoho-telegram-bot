services:
  - type: web
    name: adzoho-telegram-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        value: ADZOHO_SUPER_2026
      - key: NORMAL_ADMIN_PASSWORD
        value: ADZOHO_ADMIN_2026
      - key: TELEGRAM_SUPPORT_USERNAME
        value: Adzoho
      - key: WHATSAPP_LINK
        value: https://wa.me/15819052863
      - key: DATABASE_PATH
        value: adzoho_bot.db
      - key: LOG_LEVEL
        value: INFO
